name: THE BACKROOMS — Windows beta build

on:
  workflow_dispatch:
  push:
    branches: [arena/caa2461b-nsambo]
    paths: ['.github/workflows/backrooms-beta-windows.yml', 'desktop/**', 'desktop-tauri/**', 'launcher/**', 'app/**', 'assets/**']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build do jogo (Vite, estático)
        working-directory: app
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx vite build --config vite.config.build.js
          Copy-Item ../launcher/* dist/

      - name: Verifica o dist (falha o build se faltar algo)
        shell: pwsh
        run: |
          $required = @(
            'app/dist/backrooms.html',
            'app/dist/JOGAR.bat',
            'app/dist/server.ps1',
            'app/dist/COMO-JOGAR.txt',
            'app/dist/models/arms_rig.glb',
            'app/dist/models/psx_house_key.glb',
            'app/dist/models/psx_flashlight.glb',
            'app/dist/ost/over-the-radio.m4a',
            'app/dist/textures/backrooms/wallpaper-yellow.jpg',
            'app/dist/textures/backrooms/key-gold.jpg'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { $missing | ForEach-Object { Write-Host "FALTA: $_" }; exit 1 }
          Write-Host 'dist íntegro: launcher + modelos + texturas + OST presentes'

      - name: Rust toolchain (Tauri)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: Prepara Tauri CLI
        working-directory: desktop-tauri
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Build do instalador .exe (Tauri + WebView2, poucos MB)
        working-directory: desktop-tauri
        shell: pwsh
        run: npx tauri build --bundles nsis --features custom-protocol

      - name: Renomeia o instalador
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName NSAMBO-THE-BACKROOMS-0.1.0-beta-Windows-setup.exe

      - name: Zip do build web (sem exe — abre em qualquer browser)
        shell: pwsh
        run: |
          Compress-Archive -Path app/dist/* -DestinationPath NSAMBO-THE-BACKROOMS-0.1.0-beta-web.zip -Force
          Expand-Archive -Path NSAMBO-THE-BACKROOMS-0.1.0-beta-web.zip -DestinationPath web-check -Force
          $required = @('web-check/backrooms.html', 'web-check/JOGAR.bat', 'web-check/server.ps1', 'web-check/COMO-JOGAR.txt', 'web-check/models/arms_rig.glb', 'web-check/textures/backrooms/key-gold.jpg')
          $missing = $required | Where-Object { -not (Test-Path $_) }
          Remove-Item web-check -Recurse -Force
          if ($missing) { $missing | ForEach-Object { Write-Host "ZIP SEM: $_" }; exit 1 }
          Write-Host 'web.zip íntegro: abre com JOGAR.bat'

      - name: Publica/atualiza o Release de beta (prerelease)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'backrooms-v0.1.0-beta'
          $notes = @'
          ## THE BACKROOMS — BETA FECHADA (Lobby 0 «O Amarelo Infinito»)

          Primeira build pública de teste. Sabemos que está áspera — é a primeira tentativa. Bug reports são bem-vindos: abre uma **Issue** no repositório com o que aconteceu (semente, o que estavas a fazer, print se possível).

          ### Como jogar (Windows)

          **Opção A — instalador (recomendado):**
          1. Descarrega `NSAMBO-THE-BACKROOMS-0.1.0-beta-Windows-setup.exe`
          2. Executa o instalador (segundos) e abre pelo atalho «NSAMBO-BACKROOMS»
          3. Clica no ecrã para prender o rato (pointer lock). **Esc** liberta o rato.

          **Opção B — sem instalar (web.zip):**
          1. Descarrega `NSAMBO-THE-BACKROOMS-0.1.0-beta-web.zip`
          2. **Extrai o ZIP INTEIRO** para uma pasta nova (ex.: Documentos\Backrooms)
          3. **Duplo-clique em `JOGAR.bat`** (a pasta tem de conter JOGAR.bat e server.ps1)
          4. O browser abre sozinho em `http://127.0.0.1:8321/backrooms.html` — joga a partir daí.

          A pasta extraída tem de ter: `backrooms.html`, `JOGAR.bat`, `server.ps1`, `COMO-JOGAR.txt`, `assets/`, `textures/`, `models/`, `ost/`. Se faltar o `JOGAR.bat`, o download ficou incompleto — apaga e descarrega outra vez, ou usa o instalador (Opção A). Não precisas de npm/node/vite.

          (Usa o WebView2 que já vem no Windows — sem Chromium embutido, por isso são só poucos MB.)

          ### Controlos
          **WASD** andar · **SHIFT** correr (stamina) · **ESPAÇO** saltar · **E** interagir · **F** lanterna · **M** mini-mapa · **Esc** libertar rato

          Objetivo: encontra a chave, abre a porta SAÍDA.

          ### Notas honestas
          - Só existe o **Lobby 0**; os outros níveis são vapor, por agora.
          - Testado headless (Linux/SwiftShader): fluxo completo chave→porta→vitória verde em E2E; 300 seeds válidas com caminho spawn→saída. **Ainda não validado em hardware real** — daí esta beta.
          - FPS/som podem variar por máquina. O jogo corre em WebGL2 dentro de uma janela WebView2 (Tauri).
          '@
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag NSAMBO-THE-BACKROOMS-0.1.0-beta-Windows-setup.exe NSAMBO-THE-BACKROOMS-0.1.0-beta-web.zip --clobber
          } else {
            gh release create $tag NSAMBO-THE-BACKROOMS-0.1.0-beta-Windows-setup.exe NSAMBO-THE-BACKROOMS-0.1.0-beta-web.zip --prerelease --target $env:GITHUB_REF_NAME --title 'THE BACKROOMS — Beta 0.1.0 (Lobby 0)' --notes $notes
          }
