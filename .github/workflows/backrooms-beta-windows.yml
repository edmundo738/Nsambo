name: THE BACKROOMS — Windows beta build

on:
  workflow_dispatch:
  push:
    branches: [arena/caa2461b-nsambo]
    paths: ['.github/workflows/backrooms-beta-windows.yml', 'desktop/**', 'desktop-tauri/**', 'launcher/**', 'app/**', 'assets/**']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build do jogo (Vite, estático)
        working-directory: app
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx vite build --config vite.config.build.js
          Copy-Item ../launcher/* dist/
          Copy-Item ../multiplayer/lan-server.cjs dist/relay.cjs

      - name: Verifica o dist (falha o build se faltar algo)
        shell: pwsh
        run: |
          $required = @(
            'app/dist/backrooms.html',
            'app/dist/JOGAR.bat',
            'app/dist/server.ps1',
            'app/dist/COMO-JOGAR.txt',
            'app/dist/LAN.bat',
            'app/dist/relay.cjs',
            'app/dist/models/arms_rig.glb',
            'app/dist/models/psx_house_key.glb',
            'app/dist/models/psx_flashlight.glb',
            'app/dist/ost/over-the-radio.m4a',
            'app/dist/textures/backrooms/wallpaper-yellow.jpg',
            'app/dist/textures/backrooms/key-gold.jpg'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { $missing | ForEach-Object { Write-Host "FALTA: $_" }; exit 1 }
          Write-Host 'dist íntegro: launcher + modelos + texturas + OST presentes'

      - name: Rust toolchain (Tauri)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri

      - name: Prepara Tauri CLI
        working-directory: desktop-tauri
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Build do instalador .exe (Tauri + WebView2, poucos MB)
        working-directory: desktop-tauri
        shell: pwsh
        run: npx tauri build --bundles nsis --features custom-protocol

      - name: Renomeia o instalador
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName NSAMBO-THE-BACKROOMS-0.3.0-beta-Windows-setup.exe

      - name: Zip do build web (sem exe — abre em qualquer browser)
        shell: pwsh
        run: |
          Compress-Archive -Path app/dist/* -DestinationPath NSAMBO-THE-BACKROOMS-0.3.0-beta-web.zip -Force
          Expand-Archive -Path NSAMBO-THE-BACKROOMS-0.3.0-beta-web.zip -DestinationPath web-check -Force
          $required = @('web-check/backrooms.html', 'web-check/JOGAR.bat', 'web-check/server.ps1', 'web-check/COMO-JOGAR.txt', 'web-check/models/arms_rig.glb', 'web-check/textures/backrooms/key-gold.jpg')
          $missing = $required | Where-Object { -not (Test-Path $_) }
          Remove-Item web-check -Recurse -Force
          if ($missing) { $missing | ForEach-Object { Write-Host "ZIP SEM: $_" }; exit 1 }
          Write-Host 'web.zip íntegro: abre com JOGAR.bat'

      - name: Publica/atualiza o Release de beta (prerelease)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'backrooms-v0.3.0-beta'
          $notes = @'
          ## THE BACKROOMS — BETA 0.3.0 (LAN 1v1 — caçador vs fugidor)

          **NOVO: o primeiro multijogador do jogo — 1v1 na tua rede local (Wi-Fi/cabo).**

          - **MULTIJOGADOR (LAN) → CRIAR** — és o caçador ou o fugidor (o lado de lá fica com o oposto).
          - **PROCURAR PARTIDAS** — à Minecraft: o jogo percorre a tua rede e **lista as salas abertas**; um clique em «ENTRAR».
          - **Seed partilhado, papéis opostos.** O fugidor vê-te a ti — o caçador — como *ele*. O caçador vê o fugidor só como uma sombra na parede.
          - **Vitórias**: caçador esvazia a vida do fugidor (golpe do botão esquerdo); fugidor abre a porta SAÍDA com a chave.
          - Sem servidores na internet: o relé corre na máquina do anfitrião (`relay.cjs`, incluso no ZIP). **O anfitrião precisa de Node.js** (https://nodejs.org); o convidado não precisa de nada. Bluetooth: não suportado — dois jogos não comunicam por BLE.

          ### Como jogar LAN

          **Opção A — instalador (recomendado):** instala e abre «NSAMBO-BACKROOMS».
          **Opção B — sem instalar:** extrai o ZIP INTEIRO, duplo-clique em `JOGAR.bat` (joga local) ou `LAN.bat` (hospeda uma sala LAN).

          Para criar sala: duplo-clique em `LAN.bat` → no jogo, **MULTIJOGADOR (LAN) → CRIAR**.
          Para entrar: **PROCURAR PARTIDAS** → «ENTRAR» na sala listada (ou escreve o IP do anfitrião).

          ### Lobby 0 — «O Amarelo Infinito»
          Tudo da 0.2.0 continua (stalker com ragdoll assentado, loading fora do DOM, IA congelada após a morte, F3 em tempo real).

          ### Notas honestas
          - Sem hardware real por trás desta build — daí a beta. Bug reports: **Issue** no repositório (seed, o que fazias, print).
          - A descoberta LAN percorre os /24 mais comuns; se a rede for exótica, usa o IP manual. Se a ligação cair, a sala fecha.
          - Host precisa de Node para o relé (compilar para .exe fica para a próxima).
          - Só existe o **Lobby 0**. O resto é vapor, por agora.
          '@
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag NSAMBO-THE-BACKROOMS-0.3.0-beta-Windows-setup.exe NSAMBO-THE-BACKROOMS-0.3.0-beta-web.zip --clobber
          } else {
            gh release create $tag NSAMBO-THE-BACKROOMS-0.3.0-beta-Windows-setup.exe NSAMBO-THE-BACKROOMS-0.3.0-beta-web.zip --prerelease --target $env:GITHUB_REF_NAME --title 'THE BACKROOMS — Beta 0.3.0 (LAN 1v1)' --notes $notes
          }
