<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Banco Nacional de Angola — Reconstrução 3D</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #101720; }
    #app { position: fixed; inset: 0; }

    #hud {
      position: fixed; left: 14px; bottom: 12px; z-index: 10;
      font: 11px/1.5 system-ui, -apple-system, sans-serif; color: #e8e2d4;
      background: rgba(12, 16, 20, 0.55); padding: 5px 10px; border-radius: 3px;
      letter-spacing: .06em; pointer-events: auto; backdrop-filter: blur(3px);
    }
    #hud b { letter-spacing: .22em; }
    #hud a { color: #ffc87a; text-decoration: none; }

    #panel {
      position: fixed; top: 14px; left: 14px; z-index: 11; width: 236px;
      background: rgba(10, 13, 17, 0.74); backdrop-filter: blur(8px);
      border: 1px solid rgba(232, 226, 212, 0.14); border-radius: 4px;
      padding: 12px 12px 10px; color: #e8e2d4;
      font-family: system-ui, -apple-system, sans-serif;
      max-height: calc(100vh - 28px); overflow-y: auto; user-select: none;
    }
    #panel .brand { font-size: 13px; font-weight: 800; letter-spacing: .18em; color: #f5efdf; }
    #panel .brand span { color: #ffc87a; }
    #panel .sub { font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: #9aa3ab; margin: 2px 0 10px; }
    #panel .group { font-size: 9px; letter-spacing: .26em; color: #ffc87a; margin: 10px 2px 5px; border-top: 1px solid rgba(255,200,122,.18); padding-top: 8px; }
    #panel button {
      display: block; width: 100%; text-align: left; cursor: pointer;
      background: transparent; color: #d9d2c2; border: 1px solid transparent;
      font: 11.5px/1.35 system-ui, sans-serif; padding: 5px 7px; border-radius: 3px;
      letter-spacing: .02em; transition: background .18s, color .18s, border-color .18s;
    }
    #panel button:hover { background: rgba(255, 200, 122, 0.10); color: #ffe1ad; }
    #panel button.active { border-color: rgba(255, 200, 122, 0.55); background: rgba(255, 200, 122, 0.12); color: #ffd894; }
    #panel button kbd {
      float: right; font: 9px/1.6 ui-monospace, monospace; color: #8b939b;
      border: 1px solid rgba(255,255,255,.14); border-radius: 3px; padding: 0 4px;
    }
    #panel button.active kbd { color: #ffd894; border-color: rgba(255,216,148,.4); }
    #night-toggle {
      width: 100%; margin-top: 8px; cursor: pointer; text-align: center;
      background: linear-gradient(180deg, #1b2740, #101827); color: #ffd9a0;
      border: 1px solid rgba(255, 200, 122, 0.4); border-radius: 3px;
      font: 11px/1 system-ui; letter-spacing: .12em; padding: 8px 6px; text-transform: uppercase;
    }
    #night-toggle:hover { border-color: #ffc87a; color: #ffe9c4; }

    #info {
      position: fixed; right: 14px; top: 14px; z-index: 11; width: 264px;
      background: rgba(10, 13, 17, 0.74); backdrop-filter: blur(8px);
      border: 1px solid rgba(232, 226, 212, 0.14); border-left: 2px solid #ffc87a;
      border-radius: 4px; padding: 12px 13px; color: #e8e2d4;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #info-title { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #ffd894; margin-bottom: 6px; }
    #info-desc { font-size: 12px; line-height: 1.55; color: #cfc8b8; }

    #hint {
      position: fixed; right: 14px; bottom: 12px; z-index: 10;
      font: 10px/1.5 system-ui, sans-serif; color: #b9b2a2; letter-spacing: .04em;
      background: rgba(12, 16, 20, 0.45); padding: 4px 8px; border-radius: 3px; pointer-events: none;
    }

    #loading {
      position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
      background: #0b1018; color: #cfc8b8; font: 12px/1 system-ui; letter-spacing: .3em;
      transition: opacity .6s ease; text-transform: uppercase; pointer-events: none;
    }

    @media (max-width: 900px) {
      #panel { width: 176px; padding: 9px; }
      #info, #hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading">A reconstruir o BNA…</div>

  <div id="panel">
    <div class="brand">BANCO <span>NACIONAL</span> DE ANGOLA</div>
    <div class="sub">Reconstrução 3D · Estudo técnico</div>

    <div class="group">Vistas</div>
    <button data-view="hero">Vista geral <kbd>1</kbd></button>
    <button data-view="facade">Fachada — elevação <kbd>2</kbd></button>
    <button data-view="arcade">Arcade / ambulacro <kbd>3</kbd></button>
    <button data-view="side">Vista lateral <kbd>4</kbd></button>
    <button data-view="top">Topo — coberturas <kbd>5</kbd></button>

    <div class="group">Detalhes construtivos</div>
    <button data-view="sign">Letreiro do friso <kbd>6</kbd></button>
    <button data-view="windows">Janelas do piso nobre <kbd>7</kbd></button>
    <button data-view="dome">Cúpula e lanterna <kbd>8</kbd></button>
    <button data-view="balustrade">Balaustrada ática <kbd>9</kbd></button>
    <button data-view="ground">Zonas do solo <kbd>0</kbd></button>

    <button id="night-toggle">☾ Modo noturno (N)</button>
  </div>

  <div id="info">
    <div id="info-title">Vista geral</div>
    <div id="info-desc">Frente de 123 m para a Av. 4 de Fevereiro.</div>
  </div>

  <div id="hint">arrastar: rodar &nbsp;·&nbsp; scroll: zoom &nbsp;·&nbsp; botão direito: deslocar &nbsp;·&nbsp; teclas 1–0 · N</div>
  <div id="hud"><b>BNA</b> · Reconstrução 3D &nbsp;·&nbsp; <a href="/fase1.html">← Fase 1 · Torre Nsambo</a></div>

  <script type="module" src="/src/bna/main.js"></script>
</body>
</html>
