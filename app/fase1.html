<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nsambo — Fase 1 · O Edifício</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #16202b; }
    #app { position: fixed; inset: 0; }

    /* ---------- HUD ---------- */
    #hud {
      position: fixed; left: 14px; bottom: 12px; z-index: 10;
      font: 11px/1.5 system-ui, -apple-system, sans-serif; color: #e8e2d4;
      background: rgba(12, 16, 20, 0.55); padding: 5px 10px; border-radius: 3px;
      letter-spacing: .06em; pointer-events: none; backdrop-filter: blur(3px);
    }
    #hud b { letter-spacing: .22em; }

    /* ---------- Painel de navegação ---------- */
    #panel {
      position: fixed; top: 14px; left: 14px; z-index: 11; width: 218px;
      background: rgba(10, 13, 17, 0.72); backdrop-filter: blur(8px);
      border: 1px solid rgba(232, 226, 212, 0.14); border-radius: 4px;
      padding: 12px 12px 10px; color: #e8e2d4;
      font-family: system-ui, -apple-system, sans-serif;
      max-height: calc(100vh - 28px); overflow-y: auto; user-select: none;
    }
    #panel .brand { font-size: 15px; font-weight: 800; letter-spacing: .34em; color: #f5efdf; }
    #panel .brand span { color: #ffc87a; }
    #panel .sub { font-size: 9px; letter-spacing: .18em; text-transform: uppercase; color: #9aa3ab; margin: 2px 0 10px; }
    #panel .group { font-size: 9px; letter-spacing: .26em; color: #ffc87a; margin: 10px 2px 5px; border-top: 1px solid rgba(255,200,122,.18); padding-top: 8px; }
    #panel button {
      display: block; width: 100%; text-align: left; cursor: pointer;
      background: transparent; color: #d9d2c2; border: 1px solid transparent;
      font: 11.5px/1.35 system-ui, sans-serif; padding: 5px 7px; border-radius: 3px;
      letter-spacing: .02em; transition: background .18s, color .18s, border-color .18s;
    }
    #panel button:hover { background: rgba(255, 200, 122, 0.10); color: #ffe1ad; }
    #panel button.active { border-color: rgba(255, 200, 122, 0.55); background: rgba(255, 200, 122, 0.12); color: #ffd894; }
    #panel button kbd {
      float: right; font: 9px/1.6 ui-monospace, monospace; color: #8b939b;
      border: 1px solid rgba(255,255,255,.14); border-radius: 3px; padding: 0 4px;
    }
    #panel button.active kbd { color: #ffd894; border-color: rgba(255,216,148,.4); }

    /* ---------- Cartão de informação ---------- */
    #info {
      position: fixed; right: 14px; top: 14px; z-index: 11; width: 252px;
      background: rgba(10, 13, 17, 0.72); backdrop-filter: blur(8px);
      border: 1px solid rgba(232, 226, 212, 0.14); border-left: 2px solid #ffc87a;
      border-radius: 4px; padding: 12px 13px; color: #e8e2d4;
      font-family: system-ui, -apple-system, sans-serif; transition: opacity .25s;
    }
    #info-title { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #ffd894; margin-bottom: 6px; }
    #info-desc { font-size: 12px; line-height: 1.55; color: #cfc8b8; }

    /* ---------- Dica de controlos ---------- */
    #hint {
      position: fixed; right: 14px; bottom: 12px; z-index: 10;
      font: 10px/1.5 system-ui, sans-serif; color: #b9b2a2; letter-spacing: .04em;
      background: rgba(12, 16, 20, 0.45); padding: 4px 8px; border-radius: 3px; pointer-events: none;
    }

    #loading {
      position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
      background: #10141a; color: #cfc8b8; font: 12px/1 system-ui; letter-spacing: .3em;
      transition: opacity .6s ease; text-transform: uppercase; pointer-events: none;
    }

    @media (max-width: 900px) {
      #panel { width: 168px; padding: 9px; }
      #info { display: none; }
      #hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading">A erguer o edifício…</div>

  <div id="panel">
    <div class="brand">N<span>S</span>AMBO</div>
    <div class="sub">Fase 1 · Navegação de análise</div>

    <div class="group">Vistas</div>
    <button data-view="hero">Vista geral <kbd>1</kbd></button>
    <button data-view="street">Rua — escala humana <kbd>2</kbd></button>
    <button data-view="lobby">Entrada / Lobby <kbd>3</kbd></button>
    <button data-view="side">Lateral (tardoz) <kbd>4</kbd></button>
    <button data-view="top">Topo — cobertura <kbd>5</kbd></button>

    <div class="group">Detalhes construtivos</div>
    <button data-view="fins">Fins da torre + vidro <kbd>6</kbd></button>
    <button data-view="spandrel">Fiada de betão / tirantes <kbd>7</kbd></button>
    <button data-view="terrace">Terraço + guarda-corpo <kbd>8</kbd></button>
    <button data-view="roof">Coroamento <kbd>9</kbd></button>
    <button data-view="ground">Zonas do solo <kbd>0</kbd></button>
  </div>

  <div id="info">
    <div id="info-title">Vista geral</div>
    <div id="info-desc">Silhueta completa: pódio + torre + coroamento.</div>
  </div>

  <div id="hint">arrastar: rodar &nbsp;·&nbsp; scroll: zoom &nbsp;·&nbsp; botão direito: deslocar &nbsp;·&nbsp; teclas 1–0</div>
  <div id="hud"><b>NSAMBO</b> · Fase 1 — O Edifício &nbsp;·&nbsp; <a href="/index.html" style="color:#ffc87a;text-decoration:none">Banco Nacional de Angola →</a></div>

  <script type="module" src="/src/fase1/main.js"></script>
</body>
</html>
